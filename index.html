<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Juego 2048 con frutas y frutos secos. Combina frutas para llegar a la Aceituna 🫒." />
  <title>🫒 Fruit 2048</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1c201b;
      --surface:    #191c18;
      --surface-raised: #252a23;
      --border:     #343b31;
      --text-muted: #a3aa9d;
      --text-main:  #f3f3eb;
      --accent:     #c3e879;
      --radius:     14px;
      --gap:        10px;
    }

    html {
      min-height: 100%;
      background: linear-gradient(145deg, #252b23 0%, #1c201b 50%, #171a16 100%);
    }

    body {
      width: 100%;
      max-width: 444px;
      min-height: 100dvh;
      margin: 0 auto;
      background: transparent;
      color: var(--text-main);
      font-family: 'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 12px 24px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .game-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 0;
      background: linear-gradient(110deg, #b8db70, #f3bf58 58%, #ef8d72);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .scores { display: flex; gap: 8px; }

    .score-box {
      background: linear-gradient(155deg, #292e27, #1e221d);
      border: 1px solid rgba(224, 237, 211, 0.1);
      border-radius: 10px;
      padding: 6px 14px;
      text-align: center;
      min-width: 68px;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.04), 0 5px 14px rgba(0, 0, 0, 0.12);
    }

    .score-box .label {
      display: block;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #b2b9ab;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .score-box .value {
      display: block;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
      transition: color 0.2s;
    }

    .score-box .value.bump { color: var(--accent); }

    .controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .btn {
      background: linear-gradient(155deg, #292e27, #1e221d);
      border: 1px solid rgba(224, 237, 211, 0.12);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, background 0.15s;
    }

    .btn:hover  { background: var(--surface-raised); border-color: rgba(195, 232, 121, 0.42); }
    .btn:active { transform: scale(0.96); }

    .board-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      background: #171a16;
      border: 1px solid #394035;
      border-radius: var(--radius);
      padding: var(--gap);
      touch-action: none;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28), inset 0 1px rgba(255, 255, 255, 0.035);
    }

    .board-bg-cell {
      background: linear-gradient(145deg, #2b302a, #262b25);
      border-radius: 10px;
      aspect-ratio: 1;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.035);
    }

    .tiles-layer {
      position: absolute;
      inset: calc(var(--gap) + 1px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: var(--gap);
      pointer-events: none;
    }

    .tile {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      max-height: 100%;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.14), 0 5px 12px rgba(0, 0, 0, 0.16);
    }

    .tile-emoji {
      font-size: 2.5rem;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .tile-value {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      opacity: 0.8;
      line-height: 1;
    }

    .tile[data-v="2"]    { background:#a83d35; color:#fff; }
    .tile[data-v="4"]    { background:#d95245; color:#fff; }
    .tile[data-v="8"]    { background:#70558f; color:#fff; }
    .tile[data-v="16"]   { background:#6e8950; color:#fff; }
    .tile[data-v="32"]   { background:#986444; color:#fff; }
    .tile[data-v="64"]   { background:#bba13e; color:#201d12; }
    .tile[data-v="128"]  { background:#d7783f; color:#fff; }
    .tile[data-v="256"]  { background:#c9785d; color:#fff; }
    .tile[data-v="512"]  { background:#655087; color:#fff; }
    .tile[data-v="1024"] { background:#9a6b43; color:#fff; }
    .tile[data-v="2048"] { background:#718b45; color:#fff; box-shadow:0 0 26px rgba(195,232,121,0.34), inset 0 1px rgba(255,255,255,0.2); }

    @keyframes tile-appear {
      0%   { transform: scale(0) rotate(-8deg); opacity:0; }
      60%  { transform: scale(1.12) rotate(2deg); opacity:1; }
      100% { transform: scale(1) rotate(0deg); opacity:1; }
    }

    @keyframes tile-merge {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.28); }
      65%  { transform: scale(0.93); }
      100% { transform: scale(1); }
    }

    .tile.is-new    { animation: tile-appear 180ms ease-out both; }
    .tile.is-merged { animation: tile-merge  230ms ease-out both; }

    .hint {
      margin-top: 12px;
      font-size: 0.74rem;
      color: #aab1a4;
      text-align: center;
      max-width: 420px;
      line-height: 1.5;
    }

    .legend {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, #222720, #1b1e1a);
      border: 1px solid rgba(224, 237, 211, 0.1);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.14), inset 0 1px rgba(255, 255, 255, 0.035);
    }

    .legend-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #b0b7a8;
      margin-bottom: 8px;
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(6px);
      animation: overlay-in 280ms ease both;
    }

    @keyframes overlay-in {
      from { opacity:0; }
      to   { opacity:1; }
    }

    .overlay.hidden { display:none; }

    .overlay-box {
      background: linear-gradient(155deg, #292e27, #1d211c);
      border: 1px solid rgba(224, 237, 211, 0.12);
      border-radius: 20px;
      padding: 36px 40px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      animation: box-in 300ms cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes box-in {
      from { transform: scale(0.7) translateY(30px); opacity:0; }
      to   { transform: scale(1)   translateY(0);    opacity:1; }
    }

    .overlay-icon {
      font-size: 4rem;
      margin-bottom: 12px;
      display: block;
    }

    .overlay-title {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .overlay-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .overlay-actions { display:flex; flex-direction:column; gap:10px; }

    .btn-primary {
      background: var(--accent);
      color: #202817;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      width: 100%;
    }

    .btn-primary:hover  { filter: brightness(1.1); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }

    .btn-secondary:hover { background: var(--surface-raised); color: var(--text-main); }

    .btn:focus-visible,
    .btn-primary:focus-visible,
    .btn-secondary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .game-title { font-size: 1.35rem; }
      .scores { gap: 6px; }
      .score-box { min-width: 64px; padding-inline: 9px; }
      .tile-emoji { font-size: 1.65rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="game-title">🫒 Fruit 2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="label">Puntos</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="label">Mejor</span>
        <span class="value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <button class="btn" id="restart-btn">↺ Reiniciar</button>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board">
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
      <div class="board-bg-cell"></div><div class="board-bg-cell"></div>
    </div>
    <div class="tiles-layer" id="tiles-layer"></div>
  </div>

  <p class="hint">⌨️ Flechas o WASD &nbsp;|&nbsp; 📱 Desliza en pantalla</p>

  <div class="legend">
    <div class="legend-title">Cadena de Evolución</div>
    <div class="legend-items" id="legend-items"></div>
  </div>

  <!-- Win overlay -->
  <div class="overlay hidden" id="overlay-win">
    <div class="overlay-box">
      <span class="overlay-icon">🫒</span>
      <div class="overlay-title" style="color:#c3e879;">¡Victoria!</div>
      <div class="overlay-sub">¡Alcanzaste la Aceituna 🫒!<br>Puntuación: <strong id="win-score">0</strong></div>
      <div class="overlay-actions">
        <button class="btn-primary" id="continue-btn">🎮 Seguir Jugando</button>
        <button class="btn-secondary" id="win-restart-btn">↺ Nuevo Juego</button>
      </div>
    </div>
  </div>

  <!-- Game Over overlay -->
  <div class="overlay hidden" id="overlay-lose">
    <div class="overlay-box">
      <span class="overlay-icon">😔</span>
      <div class="overlay-title" style="color:#e74c3c;">Game Over</div>
      <div class="overlay-sub">No hay más movimientos posibles.<br>Puntuación final: <strong id="lose-score">0</strong></div>
      <div class="overlay-actions">
        <button class="btn-primary" id="lose-restart-btn">↺ Intentar de Nuevo</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    /* ── FRUIT DATA ─────────────────────────────────── */
    const FRUITS = {
      2:    { emoji: '🍒', name: 'Cereza',   bg: '#a83d35' },
      4:    { emoji: '🍓', name: 'Fresa',    bg: '#d95245' },
      8:    { emoji: '🍇', name: 'Uva',      bg: '#70558f' },
      16:   { emoji: '🫒', name: 'Aceituna', bg: '#6e8950' },
      32:   { emoji: '🥜', name: 'Nuez',     bg: '#986444' },
      64:   { emoji: '🍋', name: 'Limón',    bg: '#bba13e' },
      128:  { emoji: '🍊', name: 'Naranja',  bg: '#d7783f' },
      256:  { emoji: '🍑', name: 'Durazno',  bg: '#c9785d' },
      512:  { emoji: '🍇', name: 'Uva',      bg: '#655087' },
      1024: { emoji: '🥜', name: 'Nuez',     bg: '#9a6b43' },
      2048: { emoji: '🫒', name: 'Aceituna', bg: '#718b45' },
    };

    const SIZE    = 4;
    const WIN_VAL = 2048;

    let grid      = [];
    let score     = 0;
    let bestScore = parseInt(localStorage.getItem('fruit2048_best') || '0');
    let won       = false;
    let audioCtx  = null;

    const scoreEl     = document.getElementById('score');
    const bestEl      = document.getElementById('best');
    const tilesLayer  = document.getElementById('tiles-layer');
    const boardEl     = document.getElementById('board');
    const overlayWin  = document.getElementById('overlay-win');
    const overlayLose = document.getElementById('overlay-lose');
    const winScoreEl  = document.getElementById('win-score');
    const loseScoreEl = document.getElementById('lose-score');

    /* ── WEB AUDIO ──────────────────────────────────── */
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, type, dur, vol, freqEnd) {
      try {
        const ctx  = getCtx();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + dur + 0.01);
      } catch (_) {}
    }

    const soundMove  = () => playTone(180, 'sine', 0.07, 0.12, 130);
    const soundMerge = () => {
      playTone(440, 'sine', 0.18, 0.22, 880);
      setTimeout(() => playTone(660, 'sine', 0.15, 0.15, 990), 40);
    };
    const soundWin = () => {
      [261, 329, 392, 523].forEach((f, i) =>
        setTimeout(() => playTone(f, 'sine', 0.4, 0.25), i * 110));
    };
    const soundGameOver = () => {
      playTone(200, 'sawtooth', 0.55, 0.2, 60);
      setTimeout(() => playTone(140, 'square', 0.5, 0.15, 50), 300);
    };

    /* ── GRID HELPERS ───────────────────────────────── */
    const emptyGrid   = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    const emptyCells  = () => {
      const out = [];
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] === 0) out.push([r, c]);
      return out;
    };

    function addRandomTile() {
      const cells = emptyCells();
      if (!cells.length) return null;
      const [r, c] = cells[Math.floor(Math.random() * cells.length)];
      const val    = Math.random() < 0.9 ? 2 : 4;
      grid[r][c]   = val;
      return { r, c, val };
    }

    /* ── SLIDE ──────────────────────────────────────── */
    function slide(row) {
      let arr    = row.filter(v => v !== 0);
      let gained = 0;
      const mergePos = [];
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          gained += arr[i];
          mergePos.push(i);
          arr[i + 1] = 0;
          i++;
        }
      }
      arr = arr.filter(v => v !== 0);
      while (arr.length < SIZE) arr.push(0);
      return { line: arr, gained, mergePos };
    }

    /* ── MOVE ───────────────────────────────────────── */
    function move(dir) {
      const prevState  = JSON.stringify(grid);
      let   totalGain  = 0;
      const mergedKeys = new Set(); // r*SIZE+c of merged destination cells

      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < SIZE; r++) {
          const rev  = dir === 'right';
          const raw  = rev ? [...grid[r]].reverse() : [...grid[r]];
          const { line, gained, mergePos } = slide(raw);
          totalGain += gained;
          mergePos.forEach(i => {
            const c = rev ? SIZE - 1 - i : i;
            mergedKeys.add(r * SIZE + c);
          });
          grid[r] = rev ? [...line].reverse() : line;
        }
      } else {
        for (let c = 0; c < SIZE; c++) {
          const rev  = dir === 'down';
          const col  = Array.from({ length: SIZE }, (_, r) => grid[r][c]);
          const raw  = rev ? [...col].reverse() : col;
          const { line, gained, mergePos } = slide(raw);
          totalGain += gained;
          mergePos.forEach(i => {
            const r = rev ? SIZE - 1 - i : i;
            mergedKeys.add(r * SIZE + c);
          });
          const finalLine = rev ? [...line].reverse() : line;
          for (let r = 0; r < SIZE; r++) grid[r][c] = finalLine[r];
        }
      }

      if (JSON.stringify(grid) === prevState) return; // nothing moved

      if (totalGain) {
        score += totalGain;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('fruit2048_best', bestScore);
        }
        soundMerge();
      } else {
        soundMove();
      }

      const newTileInfo = addRandomTile();
      updateScore();
      renderTiles(mergedKeys, newTileInfo);

      // Check win
      if (!won && grid.flat().includes(WIN_VAL)) {
        won = true;
        setTimeout(() => {
          winScoreEl.textContent = score.toLocaleString();
          overlayWin.classList.remove('hidden');
          soundWin();
        }, 270);
        return;
      }

      // Check game over
      if (!hasMovesLeft()) {
        setTimeout(() => {
          loseScoreEl.textContent = score.toLocaleString();
          overlayLose.classList.remove('hidden');
          soundGameOver();
        }, 370);
      }
    }

    /* ── GAME OVER CHECK ────────────────────────────── */
    function hasMovesLeft() {
      if (emptyCells().length) return true;
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++) {
          const v = grid[r][c];
          if (r < SIZE - 1 && grid[r + 1][c] === v) return true;
          if (c < SIZE - 1 && grid[r][c + 1] === v) return true;
        }
      return false;
    }

    /* ── RENDER ─────────────────────────────────────── */
    function renderTiles(mergedKeys = new Set(), newTile = null) {
      tilesLayer.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = grid[r][c];
          // Always add a child to keep grid alignment
          if (!val) {
            tilesLayer.appendChild(document.createElement('div'));
            continue;
          }
          const fruit = FRUITS[val] || { emoji: '✨', name: String(val) };
          const tile  = document.createElement('div');
          tile.className  = 'tile';
          tile.dataset.v  = val;
          const isMerged  = mergedKeys.has(r * SIZE + c);
          const isNew     = newTile && newTile.r === r && newTile.c === c;
          if (isMerged)      tile.classList.add('is-merged');
          else if (isNew)    tile.classList.add('is-new');
          tile.innerHTML = `
            <span class="tile-emoji">${fruit.emoji}</span>
            <span class="tile-value">${val >= 1000 ? (val/1000).toFixed(0)+'k' : val}</span>
          `;
          tilesLayer.appendChild(tile);
        }
      }
    }

    /* ── SCORE UI ───────────────────────────────────── */
    function updateScore() {
      scoreEl.textContent = score.toLocaleString();
      bestEl.textContent  = bestScore.toLocaleString();
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
      setTimeout(() => scoreEl.classList.remove('bump'), 350);
    }

    /* ── INIT ───────────────────────────────────────── */
    function initGame() {
      grid  = emptyGrid();
      score = 0;
      won   = false;
      overlayWin.classList.add('hidden');
      overlayLose.classList.add('hidden');
      addRandomTile();
      addRandomTile();
      updateScore();
      renderTiles();
    }

    /* ── LEGEND ─────────────────────────────────────── */
    function buildLegend() {
      const container = document.getElementById('legend-items');
      Object.entries(FRUITS).forEach(([val, f]) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="legend-dot" style="background:${f.bg}"></div><span>${f.emoji} ${f.name}</span>`;
        container.appendChild(item);
      });
    }

    /* ── KEYBOARD ───────────────────────────────────── */
    const KEY_MAP = {
      ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
      a:'left', d:'right', w:'up', s:'down',
      A:'left', D:'right', W:'up', S:'down',
    };

    document.addEventListener('keydown', e => {
      const dir = KEY_MAP[e.key];
      if (dir) { e.preventDefault(); move(dir); }
    });

    /* ── TOUCH ──────────────────────────────────────── */
    let tx = null, ty = null;
    boardEl.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }, { passive: true });

    boardEl.addEventListener('touchend', e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      tx = ty = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 35) return;
      move(Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? 'right' : 'left')
        : (dy > 0 ? 'down'  : 'up'));
    }, { passive: true });

    /* ── BUTTONS ────────────────────────────────────── */
    document.getElementById('restart-btn').addEventListener('click', initGame);
    document.getElementById('continue-btn').addEventListener('click', () => overlayWin.classList.add('hidden'));
    document.getElementById('win-restart-btn').addEventListener('click', initGame);
    document.getElementById('lose-restart-btn').addEventListener('click', initGame);

    // Unlock audio on first user gesture
    ['click','keydown'].forEach(ev =>
      document.addEventListener(ev, () => getCtx(), { once: true }));

    /* ── BOOT ───────────────────────────────────────── */
    buildLegend();
    bestEl.textContent = bestScore.toLocaleString();
    initGame();
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit 2048</title>
  <meta name="description" content="Divertido juego 2048 con frutas, combina frutas para alcanzar la fruta más alta." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">Fruit 2048</h1>
    <div class="score-board">
      <div id="score" class="score">0</div>
    </div>
    <div id="grid" class="grid"></div>
    <p class="instructions">Usa las flechas del teclado o desliza en pantalla para mover las frutas.</p>
    <button id="new-game" class="button">Nuevo Juego</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
